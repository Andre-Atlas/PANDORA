  - url: https://www.bcb.gov.br/content/cidadaniafinanceira/documentos_cidadania/Cuidando_do_seu_dinheiro_Gestao_de_Financas_Pessoais/v4_modulo_2_caderno_educacao_financeira_430206_2026.pdf
    dica: {orgao: Banco Central do Brasil, tipo: cartilha, camada_dominio: educacao_orcamento, nivel_urgencia: preventivo, data_referencia_normativa: "2026-01-01"}
  - url: https://www.bcb.gov.br/content/cidadaniafinanceira/documentos_cidadania/Cuidando_do_seu_dinheiro_Gestao_de_Financas_Pessoais/v4_modulo_3_caderno_educacao_financeira_430206_2026.pdf
    dica: {orgao: Banco Central do Brasil, tipo: cartilha, camada_dominio: educacao_orcamento, nivel_urgencia: preventivo, data_referencia_normativa: "2026-01-01"}
  - url: https://atos.cnj.jus.br/files/compilado1456382022010761d854a688a41.pdf
