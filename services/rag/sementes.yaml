    profundidade: 1
    dica: {orgao: Banco Central do Brasil, tipo: cartilha, camada_dominio: educacao_orcamento}
  - url: https://www.gov.br/mj/pt-br/assuntos/seus-direitos/consumidor/defesadoconsumidor/Superendividamento
