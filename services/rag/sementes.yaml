# Normativos novos do BCB e do CMN, pela API de busca de normativos (formato bcb_api).
bcb_busca:
  tipos: ["Resolução CMN", "Resolução BCB", "Resolução Conjunta"]
  # O assunto precisa ter um termo ligado ao consumidor pessoa física. "crédito" e "juros" sozinhos
  # não bastam: trazem crédito rural, regra contábil e linha de fomento, que não servem ao usuário.
  termos_assunto:
    - pessoa natural
    - consumidor
    - cartão
    - rotativo
    - portabilidade
    - consignado
    - cheque especial
    - tarifa
    - superendividamento
    - renegociação
    - devolução
    - fraude
    - golpe
    - Custo Efetivo Total
    - encargos de atraso
    - cobrança de
    - correspondente
  termos_excluir:  # qualquer um destes descarta o normativo
    - rural
    - Pronaf
    - Pronamp
    - Proagro
    - agropecu
    - contábil
    - liquidez
    - patrimônio de referência
    - remessa de informações
    - Fundos Constitucionais
    - Fundo Nacional
    - sensoriamento
    - câmbio
    - derivativ
    - cooperativa
    - consórcio
  dias: 365  # janela da busca no `descobrir`; o `monitorar` olha só os últimos 60 dias
