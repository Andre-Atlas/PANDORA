    dica: {orgao: Secretaria Nacional do Consumidor, camada_dominio: juridico_superendividamento}
  - url: https://www.bcb.gov.br/publicacoes/estudosespeciais
    profundidade: 1
    dica: {orgao: Banco Central do Brasil, tipo: estudo, camada_dominio: educacao_orcamento}

  # --- Documentos já apontados pelo catálogo e pela coletânea ---
