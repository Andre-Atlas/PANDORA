[project]
name = "pandora-ingestion"
version = "0.1.0"
description = "Ingestão de extratos do PANDORA: OFX e CSV para um esquema único de transação"
requires-python = ">=3.12,<3.13"
dependencies = [
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
pandora-ingestion = "pandora_ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandora_ingestion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
