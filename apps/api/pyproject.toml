[project]
name = "pandora-api"
version = "0.1.0"
description = "API do PANDORA: FastAPI em arquitetura hexagonal"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.7",
  "psycopg[binary,pool]>=3.2",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pandora_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
