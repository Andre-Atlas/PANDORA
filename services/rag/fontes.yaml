# Inventário dos 31 itens do catálogo (docs/evidencias/01-catalogo-fontes-uso-finalidade-e-implementacao.md).
# Cada item tem um ou mais alvos (arquivo ou endpoint). `fonte_id` liga o alvo a uma fonte do corpus acima.
# Alvo sem `manual` é coletado por tipo (html, pdf, api) com `pandora-rag coletar-catalogo`.
# `manual` diz por que o alvo exige tratamento humano (sem URL estável, login, volume ou fora do corpus).
# frequencia: diaria | mensal | trimestral | semestral | anual | eventual (muda por alteração legal ou nova edição) | estatica
catalogo:
  # --- Grupo 1: educação, comportamento e psicometria ---
  - numero: 1
    nome: "Caderno de Educação Financeira: Gestão de Finanças Pessoais (2ª ed., 2026)"
    grupo: 1
    orgao: Banco Central do Brasil
    frequencia: anual
    alvos:
      - {id: bcb-caderno, fonte_id: bcb-caderno, formato: pdf, url: "https://www.bcb.gov.br/content/cidadaniafinanceira/documentos_cidadania/Cuidando_do_seu_dinheiro_Gestao_de_Financas_Pessoais/caderno_cidadania_financeira.pdf"}
  - numero: 2
    nome: "Série Cidadania Financeira nº 8 (Endividamento de Risco) e RCF 2025"
    grupo: 1
    orgao: Banco Central do Brasil
    frequencia: anual
    alvos:
      - {id: bcb-cidadania-8, fonte_id: bcb-cidadania-8, formato: pdf, url: "https://www.bcb.gov.br/content/cidadaniafinanceira/documentos_cidadania/serie_cidadania/serie_cidadania_financeira_8_endividamento_risco_2ed.pdf"}
      - {id: bcb-rcf-2025, manual: "Relatório de Cidadania Financeira 2025: o catálogo não traz o link do PDF; localizar na página de Cidadania Financeira do BCB e incluir em fontes.yaml."}
  - numero: 3
    nome: "Guia de Boas Práticas em Educação e Saúde Financeira (v7, 2025) e acervo Meu Bolso em Dia"
    grupo: 1
    orgao: Febraban e Banco Central do Brasil
    frequencia: anual
    alvos:
      - {id: febraban-guia-isfb, manual: "Guia e acervo ficam em páginas da Febraban sem URL de arquivo estável; baixar o PDF à mão e registrar o hash."}
  - numero: 4
    nome: "Série CVM Comportamental, vols. 1 a 3"
    grupo: 1
    orgao: Comissão de Valores Mobiliários
    frequencia: estatica
    alvos:
      - {id: cvm-vieses-1, manual: "Volume 1 (Vieses do Investidor) ainda não tem URL confirmada no manifesto; os volumes 2 e 3 já são coletados."}
      - {id: cvm-vieses-2, fonte_id: cvm-vieses-2, formato: pdf, url: "https://www.gov.br/investidor/pt-br/educacional/publicacoes-educacionais/cvm-comportamental/volume-2-vieses-do-poupador.pdf/@@display-file/file"}
      - {id: cvm-vieses-3, fonte_id: cvm-vieses-3, formato: pdf, url: "https://www.gov.br/investidor/pt-br/educacional/publicacoes-educacionais/cvm-comportamental/volume-3-vieses-do-consumidor.pdf/@@display-file/file"}
  - numero: 5
    nome: "Livro TOP: Planejamento Financeiro Pessoal e Mercado de Valores Mobiliários (cap. 12)"
    grupo: 1
    orgao: CVM e Planejar
    frequencia: estatica
    alvos:
      - {id: livro-top-cvm-planejar, manual: "Livro com direitos autorais e distribuição por cadastro; usar só o capítulo autorizado, obtido à mão."}
  - numero: 6
    nome: "Estudo Especial BCB 119/2024 e Raio X do Investidor Brasileiro (7ª a 9ª ed.)"
    grupo: 1
    orgao: Banco Central do Brasil e ANBIMA
    frequencia: semestral
    alvos:
      - {id: bcb-ee119, fonte_id: bcb-ee119, formato: pdf, url: "https://www.bcb.gov.br/conteudo/relatorioinflacao/EstudosEspeciais/EE119_Analise_tecnica_sobre_o_mercado_de_apostas_online_no_Brasil_e_o_perfil_dos_apostadores.pdf"}
      - {id: anbima-raio-x, manual: "Edições do Raio X ficam em página da ANBIMA sem URL estável de arquivo; baixar cada edição à mão."}
  - numero: 7
    nome: "Escalas psicométricas (IFDFW, CFPB, ICD-11 6C50) e Nudge"
    grupo: 1
    orgao: Prawitz et al.; CFPB; OMS; Thaler e Sunstein
    frequencia: estatica
    alvos:
      - {id: escalas-psicometricas, manual: "Instrumentos publicados em artigos e normas; não há feed. Os itens das escalas são transcritos à mão para o esquema do formulário."}
  # --- Grupo 2: superendividamento e defesa patrimonial ---
  - numero: 8
