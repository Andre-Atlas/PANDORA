# Pontos de partida do crawler (`pandora-rag descobrir`). Só entram URLs de domínios em dominios.yaml.
#
# profundidade: 0 visita só a própria URL; 1 segue os links dela; 2 segue os links dos links (máximo).
# dica: metadados que a curadoria já sabe. Uma candidata com dica completa recebe confiança alta.
# Tirado de docs/evidencias (catálogo, grupos 1 a 3, e coletânea). Blogs, escritórios e agregadores
# da coletânea ficam de fora pela regra de fontes oficiais.

termos_relevantes:  # um link só é seguido se o texto ou o endereço tiver um destes termos
  - superendivid
  - endivid
  - divida
  - dívida
  - credito
  - crédito
  - juros
  - cartao
  - cartão
  - rotativo
  - consignad
  - consumidor
  - orcamento
  - orçamento
  - financeira
  - financas
  - finanças
  - golpe
  - fraude
  - pix
  - cidadania
  - emprestimo
  - empréstimo
  - negocia
  - renegocia
  - minimo-existencial
  - mínimo existencial

sementes:
  # --- Páginas índice (descoberta) ---
